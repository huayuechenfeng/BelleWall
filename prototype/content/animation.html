<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#102337}#sun{position:absolute;width:48px;height:48px;border-radius:24px;background:#ffc781;top:22%;left:34%}.wave{position:absolute;width:220%;height:60%;left:-60%;border-radius:45%;background:#206777;top:65%}#front{background:#289ba3;top:80%}#dot{position:absolute;width:8px;height:8px;background:#bfffe5;border-radius:4px}</style></head>
<body><div id="sun"></div><div id="back" class="wave"></div><div id="front" class="wave"></div><div id="dot"></div>
<script type="text/javascript">
// ES3-compatible, no browser timers: the host supplies active animation time.
function bellewallStep(ms) {
 var t=ms/1000, w=document.documentElement.clientWidth, h=document.documentElement.clientHeight;
 document.getElementById('sun').style.top=(h*(0.22+Math.sin(t*0.5)*0.035))+'px';
 document.getElementById('back').style.left=(-w*0.6+Math.sin(t*0.6)*w*0.15)+'px';
 document.getElementById('front').style.top=(h*(0.78+Math.sin(t*0.8)*0.045))+'px';
 var d=document.getElementById('dot'); d.style.left=(w*(0.5+0.35*Math.sin(t)))+'px';d.style.top=(h*(0.4+0.1*Math.cos(t*0.7)))+'px';
}
bellewallStep(0);
</script></body></html>
