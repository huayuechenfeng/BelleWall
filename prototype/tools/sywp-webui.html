<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BelleWall · 壁纸工坊</title>
<link rel="icon" type="image/svg+xml" href="/bellewall-icon.svg">
<style>
:root{color-scheme:dark;--bg:#101b24;--panel:#192932;--ink:#e4f3ed;--muted:#a9bdb6;--accent:#9de8c6}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,sans-serif}header,main,footer{max-width:1080px;margin:auto;padding:24px}header{padding-top:40px}h1{font-size:32px;letter-spacing:-1px;margin:8px 0}h2{font-size:18px;margin-top:0}p{margin:8px 0}.eyebrow{color:var(--accent);font-size:13px;letter-spacing:2px}small,.muted{color:var(--muted)}main{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(260px,1fr);gap:24px;padding-top:0}.card{background:var(--panel);border:1px solid #2c4049;border-radius:16px;padding:24px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:16px}label{display:block;font-size:14px}input,select,button{font:inherit}input:not([type=range]),select{display:block;width:100%;padding:9px 10px;margin-top:5px;background:#101d25;color:var(--ink);border:1px solid #53666b;border-radius:7px}input[type=range]{width:100%;accent-color:var(--accent)}input:disabled,select:disabled{opacity:.45}.wide{grid-column:1/-1}button{width:100%;padding:13px 20px;background:var(--accent);color:#142c24;border:0;border-radius:9px;font-weight:600;margin-top:20px;cursor:pointer}button:disabled{opacity:.5;cursor:wait}#preview{width:180px;height:320px;max-width:100%;margin:20px auto;background:#000;border:2px solid #53666b;border-radius:12px;overflow:hidden}video{width:100%;height:100%;object-fit:cover}#status{white-space:pre-wrap;overflow-wrap:anywhere}a{color:var(--accent)}.hint{font-size:13px;margin-top:6px}#estimate{padding:12px 0;border-top:1px solid #36505a;margin-top:20px}.steps{font-size:14px;padding-left:20px}.steps li{margin:10px 0}footer{padding-top:0;font-size:13px;color:var(--muted)}@media(max-width:720px){main{grid-template-columns:1fr}header,main,footer{padding-left:16px;padding-right:16px}.card{padding:18px}}
</style>
<header><div class="eyebrow" style="display:flex;align-items:center;gap:10px"><img src="/bellewall-icon.svg" width="48" height="48" alt="">BELLEWALL 1.3</div><label style="float:right;max-width:180px">Language / 语言<select id="language"><option value="zh">中文</option><option value="en">English</option></select></label><h1 data-i18n="heading"></h1><p class="muted" data-i18n="intro"></p></header>
<main><section class="card"><h2 data-i18n="makeHeading"></h2><p class="hint" data-i18n="ffmpeg"></p><div class="fields">
<label class="wide"><span data-i18n="source"></span><input id="file" type="file" accept=".mp4,.webm,.mov,.mkv,.mpkg,.html"></label>
<label class="wide"><span data-i18n="name"></span><input id="title" maxlength="120"></label>
<label class="wide"><span data-i18n="preset"></span><select id="preset"><option value="180,320" data-i18n="light"></option><option value="360,640">360 × 640</option><option value="640,480">640 × 480 · E6</option><option value="640,360">640 × 360</option><option value="custom" data-i18n="custom"></option></select></label>
<label><span data-i18n="width"></span><input id="width" type="number" min="2" max="2048" step="2" value="180"></label><label><span data-i18n="height"></span><input id="height" type="number" min="2" max="2048" value="320"></label>
<label><span data-i18n="orientation"></span><select id="orientation"><option value="auto" data-i18n="auto"></option><option value="portrait" data-i18n="portrait"></option><option value="landscape" data-i18n="landscape"></option></select></label>
<label><span data-i18n="fit"></span><select id="fit"><option value="cover" data-i18n="cover"></option><option value="contain" data-i18n="contain"></option><option value="stretch" data-i18n="stretch"></option></select></label>
<label><span data-i18n="cropX"></span><input id="x" type="range" min="0" max="1" step="0.01" value="0.5"></label><label><span data-i18n="cropY"></span><input id="y" type="range" min="0" max="1" step="0.01" value="0.5"></label>
<label class="wide"><span data-i18n="encoding"></span><select id="encoding"><option value="rgb565" data-i18n="raw"></option></select></label>
<label><span data-i18n="fps"></span><select id="fps"><option value="10">10 fps</option><option value="20">20 fps</option><option value="30">30 fps</option></select></label>
<label><span data-i18n="frames"></span><input id="frames" type="number" min="1" max="100000" value="300"></label>

<label><span data-i18n="speed"></span><input id="speed" type="number" min="0.25" max="4" step="0.25" value="1"></label><label><span data-i18n="background"></span><input id="background" type="color" value="#000000"></label>
</div><p id="capability" class="hint muted"></p><p id="estimate" class="muted"></p><button id="make" data-i18n="make"></button><p id="status" role="status" aria-live="polite"></p></section>
<aside><section class="card"><h2 data-i18n="preview"></h2><div id="preview"><video id="video" muted loop controls playsinline></video></div><p id="previewHint" class="hint muted"></p></section><section class="card" style="margin-top:24px"><h2 data-i18n="install"></h2><ol class="steps"><li data-i18n="step1"></li><li data-i18n="step2"></li><li data-i18n="step3"></li><li data-i18n="step4"></li></ol><small data-i18n="playNote"></small></section></aside></main>
<footer data-i18n="footer"></footer>
<script>
const messages={
zh:{mp4Disabled:'MP4 压缩壁纸暂不支持，请选择 RGB565。',heading:'把喜欢的画面，带到桌面上。',intro:'裁剪视频或视频型 MPKG，制作 .sywp 壁纸包；也支持自包含网页。',makeHeading:'制作壁纸',ffmpeg:'Windows x64 工具包内置 FFmpeg。请完整解压并保留 ffmpeg 文件夹。',source:'源文件',name:'壁纸名称',placeholder:'例如：海边的傍晚',preset:'画布预设',light:'轻量竖屏 180 × 320',custom:'自定义尺寸',width:'宽度',height:'高度',orientation:'允许的屏幕方向',auto:'跟随屏幕',portrait:'仅竖屏，横屏时暂停',landscape:'仅横屏，竖屏时暂停',fit:'画面适配',cover:'铺满并裁剪',contain:'完整显示并补边',stretch:'拉伸',cropX:'横向裁剪位置',cropY:'纵向裁剪位置',encoding:'视频 SYWP 导出格式（MP4 压缩壁纸已暂停）',raw:'RGB565 帧 · 文件大，省去视频解码',mp4:'MP4 压缩视频 · 文件小，需要系统解码',fps:'视频帧率',frames:'最多图片张数',gop:'MP4 关键帧间隔',gop10:'10 帧 · 均衡',gop5:'5 帧 · 减少定位开销',gop1:'每帧 · 文件更大',gop30:'30 帧 · 文件更小',speed:'视频速度',background:'补边颜色',make:'生成壁纸包',preview:'裁剪预览',install:'带到手机上',step1:'下载生成的 .sywp 文件。',step2:'通过 USB 或蓝牙复制到手机，例如 E:\\BelleWall\\。',step3:'打开 BelleWall → 壁纸管理 → 导入，选择 C、E 或 F 盘。',step4:'选择壁纸，先运行“60 秒检查”，再测试持续播放。',playNote:'1.3 正式版支持按屏幕尺寸重建壁纸。锁屏、离开桌面或方向不符合壁纸设置时暂停；停止后恢复原生桌面。',footer:'文件在本机处理，不上传。支持视频型 MPKG；实时场景与 SWF 暂不支持。E7 横屏已获用户验证；E6 等非标准屏尚未实机验证。',unsupported:'此画布可按通用 SYWP 规范制作，但超过当前手机候选的 100 万像素或尺寸限制。',capMp4:'MP4 需要新版测试包和兼容系统解码器，帧率需实测。横屏及非标准屏请使用 1.3 正式版。',capRaw:'RGB565 无需视频解码。横屏、画面适配和非标准屏请使用 1.3 正式版。',capWeb:'网页按当前桌面视口实时绘制；可用 bellewallResize(width,height) 响应尺寸变化。',estimateWeb:'网页实时绘制，不预先生成图片集。',estimateMp4:'最多 {seconds} 秒循环；压缩大小取决于画面，包上限为 256 MiB。',estimateRaw:'原始帧最多约 {mib} MiB · {seconds} 秒（实际按素材长度截取）',tooLarge:'超过 256 MiB，请减少张数或尺寸。',previewEmpty:'选择视频或 MPKG 后可预览；HTML 不在这里执行。',previewWeb:'网页导入手机后实时绘制。',previewVideo:'播放预览并调整裁剪位置。',reading:'正在读取 MPKG 视频预览…',choose:'请先选择源文件。',dimensions:'请填写有效尺寸；宽度必须为偶数，边长在 2–2048 之间。',processing:'正在处理，请稍候…',done:'生成完成：',download:'下载 {name}',defaultTitle:'我的壁纸',failed:'处理失败：{detail}',genericError:'请检查输入文件、编码参数和 FFmpeg 安装。',errorScene:'实时场景请先预渲染成视频。',errorInput:'不支持此文件类型。',errorSize:'输入文件超过 512 MiB。',errorBusy:'另一个转换任务正在运行，请稍后重试。',errorOptions:'请检查画布、帧率、帧数和编码参数。',errorFfmpeg:'未找到 FFmpeg，请完整解压工具包。'},
en:{mp4Disabled:'MP4 wallpapers are temporarily unavailable. Use RGB565.',heading:'Bring your favourite scenes to your desktop.',intro:'Crop videos or video-based MPKG files into .sywp wallpapers. Self-contained web pages are also supported.',makeHeading:'Create a wallpaper',ffmpeg:'The Windows x64 bundle includes FFmpeg. Extract the complete archive and keep its ffmpeg folder.',source:'Source file',name:'Wallpaper name',placeholder:'For example: Evening by the sea',preset:'Canvas preset',light:'Lightweight portrait 180 × 320',custom:'Custom size',width:'Width',height:'Height',orientation:'Allowed screen orientation',auto:'Follow the screen',portrait:'Portrait only; pause in landscape',landscape:'Landscape only; pause in portrait',fit:'Image fit',cover:'Cover and crop',contain:'Contain with borders',stretch:'Stretch',cropX:'Horizontal crop position',cropY:'Vertical crop position',encoding:'Video SYWP output format (MP4 wallpapers suspended)',raw:'RGB565 frames · Larger files, no video decoding',mp4:'MP4 video · Smaller files, system decoding required',fps:'Video frame rate',frames:'Maximum frame count',gop:'MP4 keyframe interval',gop10:'10 frames · Balanced',gop5:'5 frames · Less seeking work',gop1:'Every frame · Larger files',gop30:'30 frames · Smaller files',speed:'Video speed',background:'Border colour',make:'Create wallpaper package',preview:'Crop preview',install:'Transfer to your phone',step1:'Download the generated .sywp file.',step2:'Copy it by USB or Bluetooth, for example to E:\\BelleWall\\.',step3:'Open BelleWall → Wallpaper library → Import, then choose C, E or F.',step4:'Select the wallpaper and run the 60-second check before continuous playback.',playNote:'The 1.3 release rebuilds the wallpaper for the screen size. Playback pauses when locked, away from the desktop, or in a disallowed orientation. Stopping restores the native desktop.',footer:'Files are processed locally, with no uploads. Video-based MPKG is supported; live scenes and SWF are not. E7 rotation is user-tested; non-standard screens such as E6 remain unverified on hardware.',unsupported:'This canvas can be created under the general SYWP format, but exceeds the phone candidate’s size or 1,048,576-pixel limit.',capMp4:'MP4 needs a new test package and a compatible system decoder. Frame rate needs device testing. Use the 1.3 release for rotation and non-standard screens.',capRaw:'RGB565 needs no video decoding. Use the 1.3 release for rotation, image fitting and non-standard screens.',capWeb:'Web pages render at the desktop viewport size. Use bellewallResize(width,height) to respond to size changes.',estimateWeb:'Web pages render live; they are not converted into image sequences.',estimateMp4:'Up to {seconds} seconds per loop. Compressed size depends on the scene; package limit: 256 MiB.',estimateRaw:'Up to about {mib} MiB of raw frames · {seconds} seconds (limited by source length)',tooLarge:'Over 256 MiB. Reduce frame count or canvas size.',previewEmpty:'Select a video or MPKG to preview. HTML is not executed here.',previewWeb:'The web page renders live after import on the phone.',previewVideo:'Play the preview and adjust the crop.',reading:'Reading the MPKG video preview…',choose:'Choose a source file first.',dimensions:'Enter dimensions between 2 and 2048. Width must be even.',processing:'Processing, please wait…',done:'Package ready: ',download:'Download {name}',defaultTitle:'My wallpaper',failed:'Processing failed: {detail}',genericError:'Check the source file, encoding settings and FFmpeg installation.',errorScene:'Pre-render this live scene to a video first.',errorInput:'This file type is not supported.',errorSize:'The input exceeds 512 MiB.',errorBusy:'Another conversion is running. Try again when it finishes.',errorOptions:'Check canvas, frame rate, frame count and encoding settings.',errorFfmpeg:'FFmpeg was not found. Extract the complete tools archive.'}
};
const $=id=>document.getElementById(id),f=$('file'),v=$('video'),status=$('status'),button=$('make');
let language=(navigator.language||'en').toLowerCase().startsWith('zh')?'zh':'en';try{const saved=localStorage.getItem('bellewall-language');if(saved==='zh'||saved==='en')language=saved;}catch(_){}
const t=(key,values={})=>(messages[language][key]||key).replace(/\{(\w+)\}/g,(_,name)=>String(values[name]??''));
const headers={'X-BelleWall-Token':'__TOKEN__'};let previewUrl,downloadUrl,generation=0,previewBusy=false,statusKey='',statusValues={},downloadName='';
function errorText(raw){const key=/MP4 wallpaper export/.test(raw)?'mp4Disabled':/Realtime scene|实时场景/.test(raw)?'errorScene':/Unsupported input|SWF unsupported/.test(raw)?'errorInput':/512 MiB|MPKG too large/.test(raw)?'errorSize':/Another conversion/.test(raw)?'errorBusy':/Invalid options|Invalid dimensions|Invalid fps|Invalid output|Keyframe interval/.test(raw)?'errorOptions':/FFmpeg.*未|找不到.*FFmpeg|FFmpeg.*not found/.test(raw)?'errorFfmpeg':'genericError';return t(key)+(key==='genericError'?'\n'+raw:'');}
function renderStatus(){status.textContent=statusKey?t(statusKey,statusKey==='failed'?{detail:errorText(statusValues.detail)}:statusValues):'';if(statusKey==='done'&&downloadUrl){const a=document.createElement('a');a.href=downloadUrl;a.download=downloadName;a.textContent=t('download',{name:downloadName});status.appendChild(a);}}
function setStatus(key,values={}){statusKey=key;statusValues=values;renderStatus();}
function fail(error){const raw=String(error.message||error);setStatus('failed',{detail:raw});}
function options(){return {title:$('title').value.trim()||f.files[0]?.name||t('defaultTitle'),width:Number($('width').value),height:Number($('height').value),fps:Number($('fps').value),encoding:$('encoding').value,orientation:$('orientation').value,fit:$('fit').value,frames:Number($('frames').value),speed:Number($('speed').value),x:Number($('x').value),y:Number($('y').value),background:$('background').value};}
function refresh(){const o=options(),web=/\.html$/i.test(f.files[0]?.name||'');if(o.width>0&&o.height>0){const scale=Math.min(320/o.height,300/o.width);$('preview').style.width=Math.round(o.width*scale)+'px';$('preview').style.height=Math.round(o.height*scale)+'px';}v.style.objectFit=o.fit==='stretch'?'fill':o.fit;v.style.objectPosition=o.fit==='cover'?`${o.x*100}% ${o.y*100}%`:'50% 50%';$('preview').style.background=o.background;v.playbackRate=o.speed||1;for(const id of ['fps','frames','speed','encoding'])$(id).disabled=web;for(const id of ['x','y'])$(id).disabled=web||o.fit!=='cover';const supported=o.width>=2&&o.height>=2&&o.width<=2048&&o.height<=2048&&o.width%2===0&&o.width*o.height<=1048576;$('capability').textContent=t(!supported?'unsupported':web?'capWeb':o.encoding==='mp4'?'capMp4':'capRaw');const mib=o.width*o.height*2*o.frames/1048576;$('estimate').textContent=t(web?'estimateWeb':o.encoding==='mp4'?'estimateMp4':'estimateRaw',{mib:mib.toFixed(1),seconds:(o.frames/o.fps).toFixed(1)})+(!web&&o.encoding==='rgb565'&&mib>256?' · '+t('tooLarge'):'');$('previewHint').textContent=t(!f.files[0]?'previewEmpty':web?'previewWeb':'previewVideo');}
function setLanguage(value){language=value;$('language').value=value;document.documentElement.lang=value==='zh'?'zh-CN':'en';document.title='BelleWall · '+t('makeHeading');for(const node of document.querySelectorAll('[data-i18n]'))node.textContent=t(node.dataset.i18n);$('title').placeholder=t('placeholder');try{localStorage.setItem('bellewall-language',value);}catch(_){}refresh();renderStatus();}
$('language').onchange=()=>setLanguage($('language').value);
for(const id of ['width','height','fit','orientation','fps','frames','speed','encoding','x','y','background'])$(id).addEventListener('input',refresh);
$('preset').onchange=()=>{const p=$('preset').value;if(p!=='custom'){[$('width').value,$('height').value]=p.split(',');refresh();}};
f.onchange=async()=>{const own=++generation;if(previewUrl)URL.revokeObjectURL(previewUrl);v.removeAttribute('src');v.load();v.hidden=true;setStatus('');const file=f.files[0];if(!file)return;$('title').value=file.name.replace(/\.[^.]+$/,'');refresh();if(/\.html$/i.test(file.name))return;try{let media=file;if(/\.mpkg$/i.test(file.name)){previewBusy=true;button.disabled=true;f.disabled=true;setStatus('reading');const r=await fetch('/preview?ext=mpkg',{method:'POST',headers,body:file});if(!r.ok)throw Error(await r.text());media=await r.blob();}if(own!==generation)return;previewUrl=URL.createObjectURL(media);v.src=previewUrl;v.hidden=false;setStatus('');}catch(e){if(own===generation)fail(e);}finally{previewBusy=false;button.disabled=false;f.disabled=false;}};
button.onclick=async()=>{if(!f.files[0]){setStatus('choose');return;}if(previewBusy)return;const o=options();if(!Number.isInteger(o.width)||o.width%2||o.width<2||o.width>2048||!Number.isInteger(o.height)||o.height<2||o.height>2048){setStatus('dimensions');return;}if(!/\.html$/i.test(f.files[0].name)&&o.encoding==='rgb565'&&o.width*o.height*2*o.frames>268435456){setStatus('tooLarge');return;}button.disabled=true;f.disabled=true;setStatus('processing');try{const r=await fetch('/convert?ext='+encodeURIComponent(f.files[0].name.split('.').pop().toLowerCase())+'&options='+encodeURIComponent(JSON.stringify(o)),{method:'POST',headers,body:f.files[0]});if(!r.ok)throw Error(await r.text());if(downloadUrl)URL.revokeObjectURL(downloadUrl);downloadUrl=URL.createObjectURL(await r.blob());downloadName=o.title.replace(/[\\/:*?"<>|]/g,'_')+'.sywp';setStatus('done');}catch(e){fail(e);}finally{button.disabled=false;f.disabled=false;}};
setLanguage(language);
</script></html>
